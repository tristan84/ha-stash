# Jellyfin Watchdog — drop this file into your HA packages/ folder.
#
# What it does:
#   1. Polls Jellyfin's health endpoint on the media PC (192.168.50.71) every 30s.
#   2. If Jellyfin is unreachable for 2 minutes it sends a persistent notification.
#   3. Once Jellyfin recovers it clears the notification and reloads the HA integration.
#
# NOTE: To add full auto-restart, enable OpenSSH on the Windows PC and add an
#       SSH key at /config/ssh/plexpc_ed25519 — then swap the notify action for
#       an SSH shell_command: Restart-Service JellyfinServer

command_line:
  - binary_sensor:
      name: jellyfin_health
      command: "curl -sf --max-time 5 http://192.168.50.71:8096/health && echo ok || echo down"
      payload_on: "ok"
      payload_off: "down"
      scan_interval: 30
      device_class: connectivity

automation:
  - id: jellyfin_watchdog_restart
    alias: "Jellyfin Watchdog — notify on outage"
    trigger:
      - platform: state
        entity_id: binary_sensor.jellyfin_health
        to: "off"
        for:
          minutes: 2
    action:
      - action: persistent_notification.create
        data:
          notification_id: jellyfin_outage
          title: "📺 Jellyfin is down"
          message: >-
            Jellyfin on the media PC (192.168.50.71) went offline at
            {{ now().strftime('%H:%M on %d %b') }}.
            Restart it on the Windows machine — or enable SSH to automate this.
    mode: single

  - id: jellyfin_watchdog_recovered
    alias: "Jellyfin Watchdog — reconnect on recovery"
    trigger:
      - platform: state
        entity_id: binary_sensor.jellyfin_health
        to: "on"
    action:
      - action: persistent_notification.dismiss
        data:
          notification_id: jellyfin_outage
      - action: homeassistant.reload_config_entry
        data:
          entry_id: 01KTACYDF6RFH987MT3KA1ZAPY
    mode: single
