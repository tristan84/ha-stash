<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <defs>
    <linearGradient id="gradHelmet" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#C7E8CB"/>
      <stop offset="55%" stop-color="#97CFA2"/>
      <stop offset="100%" stop-color="#6BAE79"/>
    </linearGradient>
    <linearGradient id="gradBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#BCE0C2"/>
      <stop offset="55%" stop-color="#90CB9C"/>
      <stop offset="100%" stop-color="#63A971"/>
    </linearGradient>
    <linearGradient id="gradFace" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4E7AA3"/>
      <stop offset="100%" stop-color="#1D2E42"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#C98FE0"/>
      <stop offset="100%" stop-color="#8C4BB8"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E0AEF0"/>
      <stop offset="100%" stop-color="#B268D6"/>
    </linearGradient>
    <linearGradient id="gradYellow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F2E0FA"/>
      <stop offset="100%" stop-color="#DDB8EF"/>
    </linearGradient>
    <linearGradient id="gradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2B44"/>
      <stop offset="100%" stop-color="#1D1522"/>
    </linearGradient>
    <radialGradient id="gradIris" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#B4EFFF"/>
      <stop offset="45%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#146FA8"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- ===================== back limbs (behind body) ===================== -->
  <g id="armBack" transform="translate(300,0)">
    <rect x="0" y="330" width="46" height="92" rx="23" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="1" y="412" width="44" height="20" rx="9" fill="url(#gradDark)"/>
    <rect x="4" y="426" width="38" height="66" rx="18" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <circle cx="23" cy="502" r="27" fill="url(#gradRed)" stroke="#6B3690" stroke-width="4"/>
  </g>
  <g id="legBack" transform="translate(228,0)">
    <rect x="0" y="470" width="48" height="76" rx="20" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="-1" y="538" width="50" height="18" rx="8" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="3"/>
    <rect x="3" y="552" width="42" height="58" rx="16" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="0" y="606" width="48" height="16" rx="7" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="3"/>
    <rect x="-8" y="618" width="66" height="38" rx="16" fill="url(#gradYellow)" stroke="#A87CC7" stroke-width="4"/>
  </g>

  <!-- ===================== antennae ===================== -->
  <g stroke="#5A9268" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="70" x2="112" y2="22"/>
    <line x1="250" y1="70" x2="288" y2="22"/>
  </g>
  <circle cx="112" cy="20" r="15" fill="url(#gradYellow)" stroke="#A87CC7" stroke-width="3"/>
  <circle cx="288" cy="20" r="15" fill="url(#gradYellow)" stroke="#A87CC7" stroke-width="3"/>

  <!-- ===================== helmet ===================== -->
  <circle cx="200" cy="180" r="140" fill="url(#gradHelmet)" stroke="#3E7A4C" stroke-width="5" filter="url(#softShadow)"/>
  <ellipse cx="160" cy="110" rx="55" ry="30" fill="#FFFFFF" opacity="0.16"/>

  <!-- crest -->
  <rect x="182" y="28" width="36" height="54" rx="12" fill="url(#gradRed)" stroke="#6B3690" stroke-width="4"/>

  <!-- ear pods -->
  <rect x="46" y="150" width="52" height="82" rx="22" fill="url(#gradRed)" stroke="#6B3690" stroke-width="4"/>
  <rect x="302" y="150" width="52" height="82" rx="22" fill="url(#gradRed)" stroke="#6B3690" stroke-width="4"/>

  <!-- face trim + face plate -->
  <rect x="80" y="88" width="240" height="188" rx="44" fill="url(#gradDark)"/>
  <rect x="92" y="100" width="216" height="164" rx="38" fill="url(#gradFace)" stroke="#6E90AC" stroke-width="3"/>

  <!-- eyes — glowing lens sockets, not human eyes: dark socket ring,
       a bright blue lens, a deep-blue core instead of a black pupil,
       and no eyebrows. This is where "a little blue" lives. -->
  <g>
    <circle cx="163" cy="168" r="40" fill="url(#gradDark)" stroke="#3E5A78" stroke-width="4"/>
    <circle cx="163" cy="168" r="29" fill="url(#gradIris)" stroke="#8FDCFF" stroke-width="2"/>
    <circle cx="163" cy="168" r="11" fill="#0F3A5C"/>
    <circle cx="154" cy="158" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <circle cx="237" cy="168" r="40" fill="url(#gradDark)" stroke="#3E5A78" stroke-width="4"/>
    <circle cx="237" cy="168" r="29" fill="url(#gradIris)" stroke="#8FDCFF" stroke-width="2"/>
    <circle cx="237" cy="168" r="11" fill="#0F3A5C"/>
    <circle cx="228" cy="158" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- mouth — a glowing LED-style smile (soft blurred underlay +
       crisp line on top) instead of a drawn human mouth; no nose. -->
  <path d="M 172,224 Q 200,246 228,224" fill="none" stroke="#4FC3F7" stroke-width="11" stroke-linecap="round" opacity="0.55" filter="url(#glowBlue)"/>
  <path d="M 172,224 Q 200,246 228,224" fill="none" stroke="#CDF3FF" stroke-width="5" stroke-linecap="round"/>

  <!-- vent slits — mechanical detail where the cheeks were. -->
  <rect x="106" y="203" width="28" height="7" rx="3.5" fill="#3A5570" opacity="0.85"/>
  <rect x="106" y="216" width="28" height="7" rx="3.5" fill="#3A5570" opacity="0.85"/>
  <rect x="266" y="203" width="28" height="7" rx="3.5" fill="#3A5570" opacity="0.85"/>
  <rect x="266" y="216" width="28" height="7" rx="3.5" fill="#3A5570" opacity="0.85"/>

  <!-- ===================== front limbs ===================== -->
  <g id="armFront" transform="translate(54,0)">
    <rect x="0" y="330" width="46" height="92" rx="23" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="1" y="412" width="44" height="20" rx="9" fill="url(#gradDark)"/>
    <rect x="4" y="426" width="38" height="66" rx="18" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <circle cx="23" cy="502" r="27" fill="url(#gradRed)" stroke="#6B3690" stroke-width="4"/>
  </g>

  <!-- neck -->
  <rect x="163" y="292" width="74" height="46" rx="16" fill="url(#gradDark)"/>

  <!-- body -->
  <rect x="120" y="310" width="160" height="150" rx="58" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="5" filter="url(#softShadow)"/>
  <ellipse cx="165" cy="345" rx="34" ry="18" fill="#FFFFFF" opacity="0.14"/>

  <!-- shoulders -->
  <circle cx="128" cy="330" r="34" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="4"/>
  <circle cx="272" cy="330" r="34" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="4"/>

  <!-- chest dial -->
  <circle cx="170" cy="368" r="28" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="3"/>
  <circle cx="170" cy="368" r="15" fill="url(#gradDark)"/>
  <circle cx="170" cy="404" r="8" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="2"/>

  <!-- waist + hip -->
  <rect x="100" y="424" width="200" height="34" rx="17" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="4"/>
  <rect x="112" y="444" width="176" height="38" rx="19" fill="url(#gradRed)" stroke="#6B3690" stroke-width="3"/>

  <g id="legFront" transform="translate(124,0)">
    <rect x="0" y="470" width="48" height="76" rx="20" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="-1" y="538" width="50" height="18" rx="8" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="3"/>
    <rect x="3" y="552" width="42" height="58" rx="16" fill="url(#gradBody)" stroke="#3E7A4C" stroke-width="4"/>
    <rect x="0" y="606" width="48" height="16" rx="7" fill="url(#gradOrange)" stroke="#8A45B0" stroke-width="3"/>
    <rect x="-8" y="618" width="66" height="38" rx="16" fill="url(#gradYellow)" stroke="#A87CC7" stroke-width="4"/>
  </g>
</svg>
