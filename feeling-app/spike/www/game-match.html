<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bubble Pop</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="game-match.css" />
</head>
<body class="screen-body">
<!-- Calm-moment game #2 (PLAN.md §4.2), rebuilt as real-time gameplay
     — two earlier versions (a multiple-choice quiz, then a static
     memory-card grid) both read as content review, not a game. This
     one has actual moving parts: bubbles continuously float up and the
     child taps the ones matching the called-out feeling before they
     drift past, with the target rotating every few catches. Still
     practices feeling-word recognition (the point of §4.2), just
     through real play/timing instead of tap-and-read. No score or
     fail state (Principle 2): a wrong tap just pops the bubble too,
     never penalized, and a bubble that floats away untapped costs
     nothing either. -->
<main class="screen-main">
  <header class="screen-header">
    <a href="games.html" class="screen-back" aria-label="Back to games">←</a>
    <span class="screen-title-chip">Bubble Pop</span>
    <span class="screen-header-spacer"></span>
  </header>

  <div id="play-view" class="catch-wrap">
    <div class="target-banner">
      <span>Catch a</span>
      <span id="target-emoji" class="target-emoji">😟</span>
      <span id="target-word" class="target-word">WORRIED</span>
      <span>bubble!</span>
      <button id="hear-target" class="hear-btn" aria-label="Hear the target feeling">🔊</button>
    </div>
    <div id="catch-stage" class="catch-stage">
      <div class="stage-bg" aria-hidden="true">
        <div class="stage-cloud sc1"></div>
        <div class="stage-cloud sc2"></div>
        <div class="stage-hill"></div>
      </div>
      <div id="pop-feedback" class="pop-feedback"></div>
      <div id="goal-jar" class="goal-jar" aria-label="Jar fills as you catch the right bubbles">
        <div class="jar-sprocket" id="jar-sprocket">
          <div class="js-antenna"><span class="js-antenna-tip"></span></div>
          <div class="js-head"><div class="js-eye left"></div><div class="js-eye right"></div></div>
        </div>
        <div class="jar-body">
          <div class="jar-fill" id="jar-fill"></div>
          <div class="jar-shine"></div>
        </div>
        <p class="jar-label"><span id="jar-count">0</span>/<span id="jar-goal">8</span></p>
      </div>
    </div>
    <div class="catch-footer">
      <p class="catch-tally">Caught: <span id="tally">0</span></p>
      <button id="btn-done" class="pill-btn quiet">I'm done</button>
    </div>
  </div>

  <div id="done-view" class="done-view" hidden>
    <div class="done-glow"></div>
    <h2>Nice catching!</h2>
    <p id="done-summary">You caught 0 feeling bubbles.</p>
    <button id="btn-again" class="pill-btn help">Play again</button>
    <a href="games.html" class="pill-btn quiet">Back to games</a>
  </div>
</main>
<script src="sw-register.js"></script>
<script src="tts.js"></script>
<script src="game-match.js"></script>
</body>
</html>
