<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sprocket Spike</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Throwaway Phase 1 spike, not final product UI — but styled to
     actually look like the target kids' app, not a debug harness.
     See research/05-capacitor-vs-native-spike-plan.md -->
<main>
  <div id="sky">
    <div class="sun-glow"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="sparkle sp1"></div>
    <div class="sparkle sp2"></div>
    <div class="sparkle sp3"></div>
    <div class="sparkle sp4"></div>
    <div class="tree t1"><div class="trunk"></div><div class="foliage f1"></div><div class="foliage f2"></div><div class="foliage f3"></div></div>
    <div class="tree t2"><div class="trunk"></div><div class="foliage f1"></div><div class="foliage f2"></div><div class="foliage f3"></div></div>
    <div class="bush b1"></div>
    <div class="bush b2"></div>
    <div class="bush b3"></div>
    <div class="flower fl1"></div>
    <div class="flower fl2"></div>
    <div class="flower fl3"></div>
    <div class="flower fl4"></div>
    <div class="flower fl5"></div>
    <div class="flower fl6"></div>
    <div class="path"></div>
  </div>

  <button id="parent-gate" aria-label="For grown-ups">🔒</button>

  <section id="stage" aria-label="Sprocket">
    <div id="sprocket" role="button" tabindex="0" aria-label="Tap Sprocket">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="head">
        <div class="antenna"><span class="antenna-tip"></span></div>
        <div class="visor">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
      <div class="collar"></div>
      <div class="shoulder left"></div>
      <div class="shoulder right"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body">
        <div class="core-ring"><div class="core"></div></div>
      </div>
      <div class="knee left"></div>
      <div class="knee right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
    <div id="bubbles"></div>
  </section>

  <!-- Real planned functions (PLAN.md §4.2-§4.6): Help me is the
       one-tap, low-friction entry point for hard moments, so it gets
       its own full-width row rather than competing with the other
       three for visual weight. The second row is the three
       calm-moment content types: games, story books, and the
       feeling diary. None of these do their real Phase 2 thing yet
       — see SPIKE_NOTES.md for exactly what each stands in for. -->
  <section id="controls">
    <div class="row-primary">
      <button id="btn-help" class="big-button help">
        <span class="icon">💛</span>
        <span>Help me</span>
      </button>
    </div>
    <div class="row-secondary">
      <button id="btn-play" class="big-button">
        <span class="icon">🎈</span>
        <span>Play a game</span>
      </button>
      <button id="btn-story" class="big-button">
        <span class="icon">📖</span>
        <span>Story time</span>
      </button>
      <button id="btn-diary" class="big-button">
        <span class="icon">📔</span>
        <span>My diary</span>
      </button>
    </div>
  </section>

  <button id="dev-toggle" aria-label="Developer info">🛠️</button>
  <section id="dev-panel" hidden>
    <div id="fps">fps: --</div>
    <div id="netstatus">net: --</div>
    <div id="ttsstatus">tts: idle</div>
    <button id="btn-spawn-dev" class="dev-button">Spawn animation stress-test</button>
    <button id="btn-clear" class="dev-button">Clear bubbles</button>
    <div id="log" aria-label="event log"></div>
  </section>
</main>
<script src="sw-register.js"></script>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
