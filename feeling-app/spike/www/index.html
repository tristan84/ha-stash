<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sprocket Spike</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Throwaway Phase 1 spike, not product UI. See research/05-capacitor-vs-native-spike-plan.md -->
<main>
  <section id="stage" aria-label="animation test stage">
    <div id="sprocket" aria-hidden="true">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div id="bubbles"></div>
  </section>

  <section id="hud">
    <div id="fps">fps: --</div>
    <div id="netstatus">net: --</div>
    <div id="ttsstatus">tts: idle</div>
  </section>

  <section id="controls">
    <button id="btn-spawn">Spawn 10 tap-bubbles</button>
    <button id="btn-speak">Sprocket: say a line</button>
    <button id="btn-clear">Clear bubbles</button>
  </section>

  <section id="log" aria-label="event log"></section>
</main>
<script src="app.js"></script>
</body>
</html>
