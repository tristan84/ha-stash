<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sprocket Spike</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Throwaway Phase 1 spike, not final product UI — but styled to
     actually look like the target kids' app, not a debug harness.
     See research/05-capacitor-vs-native-spike-plan.md -->
<main>
  <div id="sky">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <section id="stage" aria-label="Sprocket">
    <div id="sprocket">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="head">
        <div class="antenna"><span class="antenna-tip"></span></div>
        <div class="visor">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
      <div class="collar"></div>
      <div class="shoulder left"></div>
      <div class="shoulder right"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body">
        <div class="core-ring"><div class="core"></div></div>
      </div>
      <div class="knee left"></div>
      <div class="knee right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
    <div id="bubbles"></div>
  </section>

  <section id="controls">
    <button id="btn-spawn" class="big-button">
      <span class="icon">🎈</span>
      <span>Play a wiggle game</span>
    </button>
    <button id="btn-speak" class="big-button">
      <span class="icon">💬</span>
      <span>Sprocket says hi</span>
    </button>
    <button id="btn-clear" class="big-button quiet">
      <span class="icon">✨</span>
      <span>Tidy up</span>
    </button>
  </section>

  <button id="dev-toggle" aria-label="Developer info">🛠️</button>
  <section id="dev-panel" hidden>
    <div id="fps">fps: --</div>
    <div id="netstatus">net: --</div>
    <div id="ttsstatus">tts: idle</div>
    <div id="log" aria-label="event log"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
