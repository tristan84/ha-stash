<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Diary</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="diary.css" />
</head>
<body class="screen-body">
<!-- Feeling diary (PLAN.md §4.6): a real, working, on-device diary.
     Tapping a feeling logs it immediately — that stays the fast,
     low-friction core action — and then offers an optional reflection
     note (typed or voice) so a child who wants to say more can, without
     it ever being required to complete an entry. Entries (and typed
     notes) live in localStorage only (Principle 1 / Open Decision #14's
     default: private to the child, nothing sent anywhere, no parent
     view of this data exists). The voice option is the one exception
     to "nothing sent anywhere" — see the comment in diary.js. -->
<main class="screen-main">
  <header class="screen-header">
    <a href="index.html" class="screen-back" aria-label="Back home">←</a>
    <span class="screen-title-chip">My Diary</span>
    <span class="screen-header-spacer"></span>
  </header>

  <div class="screen-content">
    <p id="diary-tally" class="diary-tally"></p>

    <p class="screen-intro">What are you noticing right now?</p>
    <div id="feeling-picker" class="feeling-picker"></div>
    <p id="add-feedback" class="add-feedback" aria-live="polite"></p>

    <!-- Optional reflection note, shown right after logging a feeling.
         Typing and voice are both optional and skippable (not every
         child types comfortably) — never required to complete an
         entry. See diary.js for the on-device-privacy caveat on the
         voice option specifically. -->
    <div id="note-panel" class="note-panel" hidden>
      <p class="note-panel-title">Want to say more about <span id="note-feeling-label"></span>?</p>
      <div class="note-input-row">
        <textarea id="note-input" class="note-input" rows="2" maxlength="240" placeholder="Type here… (optional)"></textarea>
        <button id="btn-mic" class="mic-btn" aria-label="Add note by voice" hidden>🎤</button>
      </div>
      <p id="mic-status" class="mic-status" aria-live="polite"></p>
      <div class="note-panel-actions">
        <button id="btn-skip-note" class="pill-btn quiet">Skip</button>
        <button id="btn-save-note" class="pill-btn help">Save note</button>
      </div>
    </div>

    <h2 class="diary-list-heading">Your notebook</h2>
    <div id="entry-list" class="entry-list"></div>
    <p id="empty-note" class="empty-note" hidden>No entries yet — tap a feeling above whenever you notice one.</p>
  </div>
</main>
<script src="sw-register.js"></script>
<script src="diary.js"></script>
</body>
</html>
