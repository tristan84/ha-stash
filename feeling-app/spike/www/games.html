<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Play a Game</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="games.css" />
</head>
<body class="screen-body">
<!-- Game shelf: the home screen's "Play a game" button (PLAN.md §4.2)
     lands here. Used to be four flat, similar-feeling mini-games —
     replaced with Feelings Academy (a real leveled lesson structure
     with stars and unlockable rewards, see academy.html) after direct
     feedback that the old games were "far to basic... all basicly the
     same" and a request for something "more like the high-end games
     on the play store." Sprocket's Garden stays separate: it's the
     breathing regulation tool (also embedded in Help Me), not a
     lesson, so it keeps its own card rather than folding into the
     Academy's level structure. -->
<main class="screen-main">
  <header class="screen-header">
    <a href="index.html" class="screen-back" aria-label="Back home">←</a>
    <span class="screen-title-chip">Play a Game</span>
    <span class="screen-header-spacer"></span>
  </header>
  <div class="screen-content">
    <p class="screen-intro">Pick something to play with Sprocket.</p>

    <a class="academy-feature-card" href="academy.html">
      <svg class="academy-feature-art" viewBox="0 0 340 150">
        <defs>
          <linearGradient id="cardSkyAcademy" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
          </linearGradient>
        </defs>
        <rect width="340" height="150" fill="url(#cardSkyAcademy)" />
        <path d="M0,118 Q170,96 340,114 V150 H0 Z" fill="#dcea97" opacity="0.65" />
        <circle cx="40" cy="118" r="10" fill="#ffb15e" /><circle cx="40" cy="118" r="4" fill="#fff4e2" />
        <line x1="52" y1="112" x2="80" y2="122" stroke="#d9a464" stroke-width="3" stroke-dasharray="2 4" />
        <circle cx="92" cy="126" r="12" fill="#ffd35e" /><text x="92" y="131" font-size="12" text-anchor="middle">😟</text>
        <line x1="105" y1="118" x2="133" y2="100" stroke="#d9a464" stroke-width="3" stroke-dasharray="2 4" />
        <circle cx="146" cy="94" r="14" fill="#ff9b5e" /><text x="146" y="100" font-size="14" text-anchor="middle">😤</text>
        <line x1="160" y1="88" x2="188" y2="102" stroke="#d9a464" stroke-width="3" stroke-dasharray="2 4" />
        <circle cx="200" cy="110" r="12" fill="#e6dcc9" /><text x="200" y="115" font-size="13" text-anchor="middle">🔒</text>
        <line x1="212" y1="104" x2="240" y2="88" stroke="#d9a464" stroke-width="3" stroke-dasharray="2 4" />
        <circle cx="252" cy="82" r="12" fill="#e6dcc9" /><text x="252" y="87" font-size="13" text-anchor="middle">🔒</text>
        <circle cx="290" cy="55" r="30" fill="#ffedc9" opacity="0.5" />
        <circle cx="285" cy="40" r="20" fill="#ffb15e" />
        <rect x="272" y="32" width="26" height="13" rx="6" fill="#4a2e1c" />
        <circle cx="278" cy="38" r="3" fill="#ffedc9" /><circle cx="292" cy="38" r="3" fill="#ffedc9" />
      </svg>
      <div class="academy-feature-body">
        <p class="academy-feature-title">✨ Feelings Academy</p>
        <p class="academy-feature-sub">Ten levels. Real lessons. Stars &amp; rewards.</p>
      </div>
    </a>

    <div class="shelf-grid">
      <a class="shelf-card" href="game-breathe.html">
        <svg class="shelf-card-art" viewBox="0 0 200 150">
          <defs>
            <linearGradient id="cardSky1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
            </linearGradient>
          </defs>
          <rect width="200" height="150" fill="url(#cardSky1)" />
          <circle cx="168" cy="26" r="14" fill="#ffd35e" />
          <ellipse cx="30" cy="24" rx="20" ry="8" fill="#fffaf2" opacity="0.9" />
          <path d="M0,118 Q100,98 200,114 V150 H0 Z" fill="#dcea97" />
          <rect x="97" y="80" width="6" height="38" rx="3" fill="#8fbf5a" />
          <ellipse cx="88" cy="102" rx="10" ry="6" fill="#a3cc72" />
          <ellipse cx="112" cy="96" rx="10" ry="6" fill="#a3cc72" />
          <g transform="translate(100,80)">
            <ellipse rx="10" ry="15" transform="rotate(0)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(72)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(144)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(216)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(288)" fill="#ff9b7a" />
            <circle r="9" fill="#ffd35e" />
          </g>
          <circle cx="150" cy="90" r="30" fill="#ffedc9" opacity="0.55" />
          <circle cx="150" cy="90" r="16" fill="#fff4e2" />
        </svg>
        <span class="shelf-card-play" aria-hidden="true">🌬️</span>
        <div class="shelf-card-body">
          <p class="shelf-card-title">Sprocket's Garden</p>
          <p class="shelf-card-sub">breathe to grow flowers</p>
        </div>
      </a>
    </div>
  </div>
</main>
<script src="sw-register.js"></script>
</body>
</html>
