<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Play a Game</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
</head>
<body class="screen-body">
<!-- Game shelf: the home screen's "Play a game" button (PLAN.md §4.2)
     lands here. Four real games now exist — see SPIKE_NOTES.md. -->
<main class="screen-main">
  <header class="screen-header">
    <a href="index.html" class="screen-back" aria-label="Back home">←</a>
    <span class="screen-title-chip">Play a Game</span>
    <span class="screen-header-spacer"></span>
  </header>
  <div class="screen-content">
    <p class="screen-intro">Pick something to play with Sprocket.</p>
    <div class="shelf-grid">

      <a class="shelf-card" href="game-breathe.html">
        <svg class="shelf-card-art" viewBox="0 0 200 150">
          <defs>
            <linearGradient id="cardSky1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
            </linearGradient>
          </defs>
          <rect width="200" height="150" fill="url(#cardSky1)" />
          <circle cx="168" cy="26" r="14" fill="#ffd35e" />
          <ellipse cx="30" cy="24" rx="20" ry="8" fill="#fffaf2" opacity="0.9" />
          <path d="M0,118 Q100,98 200,114 V150 H0 Z" fill="#dcea97" />
          <rect x="97" y="80" width="6" height="38" rx="3" fill="#8fbf5a" />
          <ellipse cx="88" cy="102" rx="10" ry="6" fill="#a3cc72" />
          <ellipse cx="112" cy="96" rx="10" ry="6" fill="#a3cc72" />
          <g transform="translate(100,80)">
            <ellipse rx="10" ry="15" transform="rotate(0)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(72)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(144)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(216)" fill="#ff9b7a" /><ellipse rx="10" ry="15" transform="rotate(288)" fill="#ff9b7a" />
            <circle r="9" fill="#ffd35e" />
          </g>
          <circle cx="150" cy="90" r="30" fill="#ffedc9" opacity="0.55" />
          <circle cx="150" cy="90" r="16" fill="#fff4e2" />
        </svg>
        <span class="shelf-card-play" aria-hidden="true">🌬️</span>
        <div class="shelf-card-body">
          <p class="shelf-card-title">Sprocket's Garden</p>
          <p class="shelf-card-sub">breathe to grow flowers</p>
        </div>
      </a>

      <a class="shelf-card" href="game-match.html">
        <svg class="shelf-card-art" viewBox="0 0 200 150">
          <defs>
            <linearGradient id="cardSky2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
            </linearGradient>
          </defs>
          <rect width="200" height="150" fill="url(#cardSky2)" />
          <ellipse cx="164" cy="22" rx="18" ry="7" fill="#fffaf2" opacity="0.9" />
          <path d="M0,122 Q100,104 200,118 V150 H0 Z" fill="#dcea97" opacity="0.7" />
          <circle cx="52" cy="88" r="19" fill="#ffcf9c" /><text x="52" y="94" font-size="18" text-anchor="middle">😟</text>
          <circle cx="104" cy="52" r="22" fill="#ffb199" /><text x="104" y="59" font-size="20" text-anchor="middle">😤</text>
          <circle cx="150" cy="98" r="16" fill="#ffe08a" /><text x="150" y="104" font-size="15" text-anchor="middle">🤩</text>
          <rect x="168" y="112" width="18" height="26" rx="4" fill="#fffaf2" opacity="0.7" />
          <rect x="168" y="122" width="18" height="16" rx="3" fill="#ffb15e" />
        </svg>
        <span class="shelf-card-play" aria-hidden="true">🎯</span>
        <div class="shelf-card-body">
          <p class="shelf-card-title">Bubble Pop</p>
          <p class="shelf-card-sub">catch the right feeling</p>
        </div>
      </a>

      <a class="shelf-card" href="game-sort.html">
        <svg class="shelf-card-art" viewBox="0 0 200 150">
          <defs>
            <linearGradient id="cardSky3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
            </linearGradient>
          </defs>
          <rect width="200" height="150" fill="url(#cardSky3)" />
          <ellipse cx="170" cy="20" rx="16" ry="6" fill="#fffaf2" opacity="0.9" />
          <text x="60" y="60" font-size="20" text-anchor="middle">😢</text>
          <text x="110" y="40" font-size="18" text-anchor="middle">🙌</text>
          <rect x="30" y="112" width="42" height="30" rx="6" fill="#e6c9a0" />
          <rect x="79" y="112" width="42" height="30" rx="6" fill="#e6c9a0" />
          <rect x="128" y="112" width="42" height="30" rx="6" fill="#e6c9a0" />
        </svg>
        <span class="shelf-card-play" aria-hidden="true">🧺</span>
        <div class="shelf-card-body">
          <p class="shelf-card-title">Feeling Sort</p>
          <p class="shelf-card-sub">drag each face to its basket</p>
        </div>
      </a>

      <a class="shelf-card" href="game-tool.html">
        <svg class="shelf-card-art" viewBox="0 0 200 150">
          <defs>
            <linearGradient id="cardSky4" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2d9" /><stop offset="100%" stop-color="#ffdcb3" />
            </linearGradient>
          </defs>
          <rect width="200" height="150" fill="url(#cardSky4)" />
          <path d="M0,120 Q100,102 200,116 V150 H0 Z" fill="#dcea97" opacity="0.6" />
          <circle cx="100" cy="78" r="30" fill="#ffb15e" />
          <rect x="84" y="66" width="32" height="16" rx="8" fill="#4a2e1c" />
          <circle cx="92" cy="74" r="4" fill="#ffedc9" /><circle cx="108" cy="74" r="4" fill="#ffedc9" />
          <text x="150" y="45" font-size="22" text-anchor="middle">🌬️</text>
          <text x="45" y="110" font-size="18" text-anchor="middle">🫂</text>
        </svg>
        <span class="shelf-card-play" aria-hidden="true">🧰</span>
        <div class="shelf-card-body">
          <p class="shelf-card-title">Tool Match</p>
          <p class="shelf-card-sub">drag the right tool to Sprocket</p>
        </div>
      </a>

    </div>
  </div>
</main>
<script src="sw-register.js"></script>
</body>
</html>
