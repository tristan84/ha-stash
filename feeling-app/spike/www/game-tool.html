<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tool Match</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="game-tool.css" />
</head>
<body class="screen-body">
<!-- Calm-moment game #4 (PLAN.md §4.2). Drag-and-drop again, but a
     different shape of interaction than Feeling Sort: instead of
     catching drifting cards, four still tool tiles sit in a tray and
     the child drags the one that matches the shown feeling onto
     Sprocket. Directly reinforces the "try a tool" step from the ten
     story books — same feeling/tool pairings as the books use, not a
     separate invented mapping. A wrong drop just springs the tile back
     to the tray, never a penalty (Principle 2). -->
<main class="screen-main">
  <header class="screen-header">
    <a href="games.html" class="screen-back" aria-label="Back to games">←</a>
    <span class="screen-title-chip">Tool Match</span>
    <span class="screen-header-spacer"></span>
  </header>

  <div id="play-view" class="tool-wrap">
    <div class="tool-banner">
      <span>Sprocket feels</span>
      <span id="target-emoji" class="target-emoji">😟</span>
      <span id="target-word" class="target-word">WORRIED</span>
      <button id="hear-target" class="hear-btn" aria-label="Hear the feeling">🔊</button>
    </div>
    <p class="tool-why">Drag the tool that helps onto Sprocket.</p>

    <div id="tool-stage" class="tool-stage">
      <div class="stage-bg" aria-hidden="true">
        <div class="stage-cloud tsc1"></div>
        <div class="stage-cloud tsc2"></div>
        <div class="stage-hill"></div>
      </div>
      <div id="drop-zone" class="drop-zone">
        <div id="stage-sprocket" class="stage-sprocket">
          <div class="ss-antenna"><span class="ss-antenna-tip"></span></div>
          <div class="ss-head"><div class="ss-eye left"></div><div class="ss-eye right"></div></div>
          <div class="ss-body"><div class="ss-core"></div></div>
        </div>
        <div id="reaction-burst" class="reaction-burst"></div>
      </div>
      <div id="tool-feedback" class="tool-feedback"></div>
      <div id="goal-jar" class="goal-jar" aria-label="Jar fills as you match the right tool">
        <div class="jar-body">
          <div class="jar-fill" id="jar-fill"></div>
          <div class="jar-shine"></div>
        </div>
        <p class="jar-label"><span id="jar-count">0</span>/<span id="jar-goal">8</span></p>
      </div>
    </div>

    <div id="tool-tray" class="tool-tray"></div>

    <div class="tool-footer">
      <p class="tool-tally">Matched: <span id="tally">0</span></p>
      <button id="btn-done" class="pill-btn quiet">I'm done</button>
    </div>
  </div>

  <div id="done-view" class="done-view" hidden>
    <div class="done-glow"></div>
    <h2>Great matching!</h2>
    <p id="done-summary">You matched 0 tools.</p>
    <button id="btn-again" class="pill-btn help">Play again</button>
    <a href="games.html" class="pill-btn quiet">Back to games</a>
  </div>
</main>
<script src="sw-register.js"></script>
<script src="tts.js"></script>
<script src="game-tool.js"></script>
</body>
</html>
