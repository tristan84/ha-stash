<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Story Time</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="stories.css" />
</head>
<body class="screen-body">
<!-- Book shelf: the "Story time" home-screen button lands here first,
     then into whichever book (PLAN.md §4.5). Three books now exist,
     each a different feeling with its own body/mind signature and its
     own tool — see SPIKE_NOTES.md. Rebuilt as book covers on a shelf
     after "the books need to look like real books with real covers." -->
<main class="screen-main">
  <header class="screen-header">
    <a href="index.html" class="screen-back" aria-label="Back home">←</a>
    <span class="screen-title-chip">Story Time</span>
    <span class="screen-header-spacer"></span>
  </header>
  <div class="screen-content">
    <p class="screen-intro">Pick a book to read with Sprocket.</p>

    <div class="book-shelf-row">
      <a class="book-cover book-worried" href="story.html">
        <div class="book-face">
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Fluttery Day</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">🦋</span>
        </div>
        <p class="book-shelf-sub">worried</p>
      </a>

      <a class="book-cover book-frustrated" href="story-frustrated.html">
        <div class="book-face">
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Wobbly Tower</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">🧱</span>
        </div>
        <p class="book-shelf-sub">frustrated</p>
      </a>

      <a class="book-cover book-excited" href="story-excited.html">
        <div class="book-face">
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Bouncy Morning</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">⭐</span>
        </div>
        <p class="book-shelf-sub">excited</p>
      </a>
    </div>
    <div class="shelf-plank"></div>
  </div>
</main>
<script src="sw-register.js"></script>
</body>
</html>
