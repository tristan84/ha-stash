<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Story Time</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="stories.css" />
</head>
<body class="screen-body">
<!-- Book shelf: the "Story time" home-screen button lands here first,
     then into whichever book (PLAN.md §4.5). Three books now exist,
     each a different feeling with its own body/mind signature and its
     own tool — see SPIKE_NOTES.md. Rebuilt as book covers on a shelf
     after "the books need to look like real books with real covers,"
     then given an actual illustrated scene (ground + Sprocket) on each
     cover after a follow-up "the covers need to be story book covers"
     — a flat color card with an emoji read as a color swatch, not a
     book cover. -->

<!-- Shared cover art pieces, reused via <use> across all three covers —
     same character design and the same prop symbols already used
     inside each book itself (bush/blockScatter/starSpark), composed
     fresh for a portrait cover rather than cropping a landscape book
     page. The cover's "sky" stays the saturated CSS gradient per book
     (see .book-worried etc. below) rather than each book's own paler
     in-story sky, so the title stays legible over it. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="coverBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb15e" /><stop offset="100%" stop-color="#f0873a" />
    </linearGradient>
    <radialGradient id="coverCoreGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff8e8" /><stop offset="100%" stop-color="#ffd35e" />
    </radialGradient>
    <radialGradient id="coverGlowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedc9" stop-opacity="0.9" /><stop offset="100%" stop-color="#ffedc9" stop-opacity="0" />
    </radialGradient>

    <symbol id="coverCloud" viewBox="0 0 70 26">
      <ellipse cx="16" cy="16" rx="16" ry="10" fill="#fffaf2" /><ellipse cx="34" cy="9" rx="15" ry="12" fill="#fffaf2" /><ellipse cx="52" cy="15" rx="12" ry="9" fill="#fffaf2" />
    </symbol>
    <symbol id="coverBush" viewBox="0 0 54 26">
      <ellipse cx="14" cy="16" rx="14" ry="10" fill="#c6db76" /><ellipse cx="30" cy="10" rx="16" ry="12" fill="#b6d98a" /><ellipse cx="45" cy="16" rx="11" ry="9" fill="#c6db76" />
    </symbol>
    <symbol id="coverBlockScatter" viewBox="0 0 120 40">
      <rect x="4" y="18" width="24" height="16" rx="3" fill="#ff9b5e" transform="rotate(-8 16 26)" />
      <rect x="40" y="8" width="22" height="16" rx="3" fill="#ffd35e" transform="rotate(12 51 16)" />
      <rect x="78" y="16" width="20" height="16" rx="3" fill="#b6d98a" transform="rotate(-14 88 24)" />
      <rect x="98" y="2" width="18" height="14" rx="3" fill="#ff8a72" transform="rotate(20 107 9)" />
    </symbol>
    <symbol id="coverStarSpark" viewBox="0 0 40 40">
      <path d="M20,2 L25,16 L38,20 L25,24 L20,38 L15,24 L2,20 L15,16 Z" fill="#ffd35e" />
    </symbol>

    <symbol id="coverSprocket" viewBox="0 0 120 150">
      <ellipse cx="18" cy="52" rx="10" ry="12" fill="url(#coverBodyGrad)" />
      <ellipse cx="102" cy="52" rx="10" ry="12" fill="url(#coverBodyGrad)" />
      <rect x="4" y="0" width="3" height="18" fill="#f0873a" />
      <circle cx="5.5" cy="0" r="6" fill="#ffd35e" />
      <circle cx="60" cy="46" r="44" fill="url(#coverBodyGrad)" />
      <rect x="30" y="34" width="60" height="30" rx="15" fill="#4a2e1c" />
      <circle cx="45" cy="49" r="7" fill="#ffedc9" />
      <circle cx="75" cy="49" r="7" fill="#ffedc9" />
      <path d="M48,56 Q60,64 72,56" stroke="#ffedc9" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="24" cy="66" rx="7" ry="4.5" fill="#ff8a72" opacity="0.8" />
      <ellipse cx="96" cy="66" rx="7" ry="4.5" fill="#ff8a72" opacity="0.8" />
      <rect x="45" y="88" width="30" height="12" rx="6" fill="#f0873a" />
      <rect x="20" y="98" width="80" height="52" rx="26" fill="url(#coverBodyGrad)" />
      <circle cx="60" cy="122" r="18" fill="#fff4e2" />
      <circle cx="60" cy="122" r="13" fill="url(#coverCoreGrad)" />
      <rect x="4" y="108" width="16" height="34" rx="8" fill="url(#coverBodyGrad)" />
      <rect x="100" y="108" width="16" height="34" rx="8" fill="url(#coverBodyGrad)" />
      <rect x="34" y="146" width="20" height="4" rx="2" fill="#e8722c" />
      <rect x="66" y="146" width="20" height="4" rx="2" fill="#e8722c" />
    </symbol>
  </defs>
</svg>

<main class="screen-main">
  <header class="screen-header">
    <a href="index.html" class="screen-back" aria-label="Back home">←</a>
    <span class="screen-title-chip">Story Time</span>
    <span class="screen-header-spacer"></span>
  </header>
  <div class="screen-content">
    <p class="screen-intro">Pick a book to read with Sprocket.</p>

    <div class="book-shelf-row">
      <a class="book-cover book-worried" href="story.html">
        <div class="book-face">
          <svg class="book-scene" viewBox="0 0 160 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <path d="M0,172 Q80,155 160,169 V240 H0 Z" fill="#dccf9a" opacity="0.9" />
            <path d="M0,185 Q80,172 160,183 V240 H0 Z" fill="#c2b378" opacity="0.9" />
            <circle cx="128" cy="26" r="15" fill="url(#coverGlowSoft)" />
            <circle cx="128" cy="26" r="9" fill="#ffd35e" />
            <use href="#coverCloud" x="12" y="14" width="40" height="15" />
            <use href="#coverBush" x="6" y="160" width="34" height="18" />
            <use href="#coverBush" x="116" y="156" width="38" height="20" />
            <use href="#coverSprocket" x="45" y="82" width="70" height="88" />
          </svg>
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Fluttery Day</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">🦋</span>
        </div>
        <p class="book-shelf-sub">worried</p>
      </a>

      <a class="book-cover book-frustrated" href="story-frustrated.html">
        <div class="book-face">
          <svg class="book-scene" viewBox="0 0 160 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <path d="M0,172 Q80,155 160,169 V240 H0 Z" fill="#c9d97a" opacity="0.9" />
            <path d="M0,185 Q80,172 160,183 V240 H0 Z" fill="#a8c25c" opacity="0.9" />
            <use href="#coverCloud" x="14" y="14" width="36" height="14" />
            <use href="#coverBlockScatter" x="86" y="148" width="58" height="20" />
            <use href="#coverSprocket" x="42" y="82" width="70" height="88" />
          </svg>
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Wobbly Tower</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">🧱</span>
        </div>
        <p class="book-shelf-sub">frustrated</p>
      </a>

      <a class="book-cover book-excited" href="story-excited.html">
        <div class="book-face">
          <svg class="book-scene" viewBox="0 0 160 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <path d="M0,172 Q80,155 160,169 V240 H0 Z" fill="#e0f0a0" opacity="0.9" />
            <path d="M0,185 Q80,172 160,183 V240 H0 Z" fill="#c9e06a" opacity="0.9" />
            <circle cx="126" cy="28" r="15" fill="url(#coverGlowSoft)" />
            <circle cx="126" cy="28" r="9" fill="#ffd35e" />
            <use href="#coverStarSpark" x="18" y="46" width="16" height="16" />
            <use href="#coverStarSpark" x="122" y="86" width="12" height="12" />
            <use href="#coverSprocket" x="44" y="80" width="70" height="88" />
          </svg>
          <div class="book-spine"></div>
          <p class="book-cover-title">Sprocket's Bouncy Morning</p>
          <p class="book-cover-author">A Sprocket Story</p>
          <span class="book-cover-emblem" aria-hidden="true">⭐</span>
        </div>
        <p class="book-shelf-sub">excited</p>
      </a>
    </div>
    <div class="shelf-plank"></div>
  </div>
</main>
<script src="sw-register.js"></script>
</body>
</html>
